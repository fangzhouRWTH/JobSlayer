[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobslayer"
version = "0.1.0"
description = "Governed control plane for AI-collaborative engineering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
observability = [
    "opentelemetry-api>=1.27,<2",
]

[project.scripts]
jobslayer = "jobslayer.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jobslayer.supervision.ui" = ["*.html", "*.css", "*.js"]
"jobslayer.persistence.migrations" = ["*.sql"]
"jobslayer.persistence.postgres_migrations" = ["*.sql"]
"jobslayer.management.ui" = ["*.html", "*.css", "*.js"]
