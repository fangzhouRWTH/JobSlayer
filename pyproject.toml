[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobslayer"
version = "0.1.0"
description = "Governed control plane for AI-collaborative engineering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.scripts]
jobslayer = "jobslayer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

