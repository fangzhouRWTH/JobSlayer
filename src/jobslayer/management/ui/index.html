<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>JobSlayer · Agent 开发管理</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">JOBSLAYER CONTROL PLANE</p>
        <h1>Agent 开发管理</h1>
      </div>
      <div class="identity"><span id="identity">身份校验中</span><span id="live" class="live">● LIVE</span></div>
    </header>
    <main>
      <section class="metrics" aria-label="运行概览">
        <article><span>运行总数</span><strong id="total-runs">—</strong></article>
        <article><span>待人工决策</span><strong id="pending-decisions">—</strong></article>
        <article><span>无效运行</span><strong id="invalid-runs">—</strong></article>
        <article><span>Token 用量</span><strong id="tokens">—</strong></article>
      </section>
      <section class="panel">
        <div class="panel-head">
          <div><p class="eyebrow">PERSISTED RUNS</p><h2>任务与执行器</h2></div>
          <label>筛选 <input id="filter" type="search" placeholder="run / task / state"></label>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Run / Task</th><th>状态</th><th>执行器</th><th>验证</th><th>审查 / 决策</th><th>用量</th></tr></thead>
            <tbody id="runs"><tr><td colspan="6" class="empty">正在读取持久事件…</td></tr></tbody>
          </table>
        </div>
      </section>
      <section id="detail" class="panel detail" hidden>
        <div class="panel-head"><div><p class="eyebrow">RUN EVIDENCE</p><h2 id="detail-title">运行证据</h2></div><button id="close-detail" type="button">关闭</button></div>
        <h3>工作流转换</h3>
        <div id="timeline" class="timeline"></div>
        <h3>Run 记录</h3>
        <div id="run-records" class="timeline"></div>
        <h3>持久事件</h3>
        <div id="control-events" class="timeline"></div>
        <h3>制品</h3>
        <div id="artifacts" class="artifact-grid"></div>
      </section>
      <p id="error" class="error" role="alert"></p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
